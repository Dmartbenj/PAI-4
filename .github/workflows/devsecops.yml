name: DevSecOps Pipeline

# Disparadores: cada push o pull request a main, y lanzamiento manual
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos del token para todos los jobs
permissions:
  contents: read

jobs:
  # Etapa de build/análisis estático (en paralelo)
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep (versión fijada)
        run: pip install semgrep==1.185.0

      - name: Análisis SAST con Semgrep
        run: |
          semgrep scan --config p/javascript --config p/typescript \
            --config p/nodejsscan --config p/owasp-top-ten \
            --json --output semgrep-report.json

      - name: Subir informe de Semgrep
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2        
        with:
          name: semgrep-report
          path: semgrep-report.json

      - name: Quality gate SAST (modo aviso)
        continue-on-error: true
        run: |
          N=$(jq '[.results[] | select(.extra.severity | IN("CRITICAL","HIGH","ERROR"))] | length' semgrep-report.json)
          echo "Hallazgos de severidad critica o alta: $N"
          if [ "$N" -gt 0 ]; then
            echo "::warning title=Quality gate SAST::Semgrep ha encontrado $N hallazgos de severidad critica o alta"
            exit 1
          fi

  sca:
    name: SCA
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "Aquí irá el análisis SCA (parte 2)"

  # Etapa de pruebas: build de la imagen, staging y DAST
  build-staging-dast:
    name: Build, staging y DAST
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - name: Placeholder
        run: echo "Aquí irán el build, el despliegue en staging y el DAST (parte 3)"

  # Centralización de resultados (se ejecuta siempre)
  import-defectdojo:
    name: Importar informes a DefectDojo
    runs-on: ubuntu-latest
    needs: [sast, sca, build-staging-dast]
    if: always()
    steps:
      - name: Placeholder
        run: echo "Aquí se enviarán los informes a DefectDojo por API (parte 2)"

  # Producción: solo push a main y solo si pasan los gates
  deploy-produccion:
    name: Despliegue en producción
    runs-on: ubuntu-latest
    needs: [build-staging-dast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: produccion
    steps:
      - name: Placeholder
        run: echo "Aquí irá el despliegue en producción"